[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-puzzle"
version = "0.5.0"
description = "Local, auditable Bitcoin Genesis Puzzle researcher (deterministic Stage A, Stage B, Stage C, Stage D, and Stage E; sequential/offline)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Joshua Kruger" }]
license = { text = "MIT" }
dependencies = [
    "coincurve==21.0.0",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
    "mypy==1.15.0",
    "build==1.2.2.post1",
]

[project.scripts]
genesis-puzzle = "genesis_puzzle.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genesis_puzzle = ["py.typed", "data/*.json", "data/*.toml"]

[tool.ruff]
target-version = "py39"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["UP006", "UP007", "UP035"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.9"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
